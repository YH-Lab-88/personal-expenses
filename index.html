<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#123c70" />
    <link rel="icon" href="./logo.png" type="image/png" />
    <title>个人花费</title>
    <link rel="manifest" href="./manifest.webmanifest?v=20260818-1" />
    <link rel="stylesheet" href="./styles.css" />
    <style>
      :root{--ink:#123c70;--muted:#6c7f96;--line:#d9e5f2;--bg:#f3f7fc;--accent:#2d74c8;--soft:#eaf3fd;--shadow:0 14px 35px rgba(18,60,112,.1)}
      .hero-card{background:linear-gradient(135deg,#123c70,#2d74c8)}.hero-mark{overflow:hidden}.hero-mark img{width:100%;height:100%;object-fit:cover}
      .month-chip{border-color:#c9dcf2;background:#f8fbff}
      .local-badge{color:#2868ae;text-decoration:none}
      input,select{background:#fbfdff}
      input[type=date]{height:50px;min-height:50px;padding:0 13px;appearance:none;-webkit-appearance:none;color:#234d7e;font-weight:700;color-scheme:light}
      #date{height:50px;text-align:left;font-weight:700;letter-spacing:.02em;flex:1}
      .field-row{display:grid;grid-template-columns:42px 1fr;align-items:center;gap:10px;position:relative}.field-row>label{display:block;color:var(--muted);font-size:.8rem;font-weight:750}.field-row>input,.field-row>select{grid-column:2}.field-row>#datePicker{position:absolute;right:0;width:42px;height:42px;opacity:0;z-index:2;cursor:pointer}
      .date-control{grid-column:2;display:flex;align-items:center;gap:8px}.date-control #date{grid-column:auto}.calendar-button{display:grid;place-items:center;width:42px;height:42px;flex:0 0 42px;border:1px solid #c9dcf2;border-radius:10px;color:#2868ae;background:#eaf3fd;font-size:1.15rem;cursor:pointer}
      input[type=number]{text-align:right;font-variant-numeric:tabular-nums lining-nums}
      #cost{text-align:left}
      .month-chip strong,.hero-card strong,.bar-value,.record .amount,.month-analysis-head span{font-variant-numeric:tabular-nums lining-nums}
      .bar-value,.record .amount,.month-analysis-head span{white-space:nowrap;text-align:right}
      input[type=number]{text-align:right;font-variant-numeric:tabular-nums}
      .month-chip strong,.hero-card strong,.amount,.bar-value,.month-analysis-head span{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
      .amount,.bar-value,.month-analysis-head span{min-width:82px;text-align:right;white-space:nowrap}
      input:focus,select:focus{outline-color:rgba(45,116,200,.2)}
      .bar-track{background:#e9f0f8}
      .topbar>div:first-child{min-width:0;flex:1}.top-actions{display:flex;flex:0 0 auto;flex-direction:column;align-items:flex-end;gap:8px}
      .view-switch{display:flex;flex-wrap:nowrap;justify-content:flex-end;gap:3px;padding:4px;border-radius:12px;background:#eaf3fd}.view-button{padding:7px 6px;border:0;border-radius:8px;color:#2868ae;background:transparent;font-size:.67rem;font-weight:800;white-space:nowrap;cursor:pointer}.view-button.active{color:#fff;background:#2d74c8}.analysis-view{min-height:220px}
      .month-analysis{padding:14px 0;border-bottom:1px solid var(--line)}.month-analysis:last-child{border-bottom:0}.month-analysis-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;color:var(--ink)}
      .category-breakdown{margin:7px 0 13px 0;padding:8px 10px;border:1px solid #e1ebf6;border-radius:10px;background:#fbfdff}.category-detail{display:grid;grid-template-columns:44px minmax(0,1fr) 72px;gap:8px;align-items:center;padding:5px 0;color:var(--muted);font-size:.7rem}.category-detail+.category-detail{border-top:1px solid #edf2f8}.category-detail span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.category-detail .detail-cost{color:var(--ink);font-weight:800;text-align:right;font-variant-numeric:tabular-nums}.category-empty{display:block;color:var(--muted);font-size:.7rem;padding:3px 0}
      .analysis-subhead,.analysis-detail-heading{margin:13px 0 7px;color:#2868ae;font-size:.72rem;font-weight:850;letter-spacing:.04em}.analysis-subhead{margin-top:0}.analysis-detail-heading{padding-top:11px;border-top:1px solid var(--line)}.category-breakdown-head{display:flex;justify-content:space-between;gap:12px;padding-bottom:5px;color:var(--ink);font-size:.76rem;font-weight:850}.category-breakdown-head span:last-child{font-variant-numeric:tabular-nums}
      .comparison-scroll{overflow-x:auto;padding-bottom:4px}.comparison-table{width:max-content;min-width:100%;border-collapse:collapse;font-size:.72rem}.comparison-table th,.comparison-table td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}.comparison-table th{position:sticky;top:0;background:#f8fbff;color:var(--muted);font-weight:800}.comparison-table th:first-child,.comparison-table td:first-child{position:sticky;left:0;background:#fff;text-align:left;color:var(--ink);font-weight:850}.comparison-table th:first-child{background:#f8fbff}.comparison-table td{color:var(--ink);min-width:104px}.comparison-table td:first-child{min-width:0}
      .comparison-cell{display:grid;grid-template-columns:72px 14px;justify-content:end;align-items:center;column-gap:4px}.comparison-value{font-weight:800;text-align:right}.comparison-trend{font-size:.68rem;font-weight:900;text-align:center}.comparison-trend.up{color:#d24f55}.comparison-trend.down{color:#15938f}
      .analysis-month-picker{width:auto;height:36px;min-height:36px;padding:0 8px;border-color:#c9dcf2;border-radius:9px;color:#2868ae;font-size:.76rem;font-weight:800}
      .fuel-summary{margin:3px 0 8px;padding:7px 8px;border-radius:8px;background:#eef6ff}.fuel-summary-row{display:flex;justify-content:space-between;align-items:center;padding:3px 0;color:#2868ae;font-size:.7rem;font-weight:800}.fuel-summary-row span:last-child{color:var(--ink);font-variant-numeric:tabular-nums}
      .detail-toggle{width:100%;margin-top:3px;padding:6px 0;border:0;border-top:1px solid #e6eef7;background:transparent;color:#2868ae;font-size:.7rem;font-weight:850;text-align:left;cursor:pointer}.category-record-list{padding-top:3px}
      .refresh-button{padding:7px 10px;border:1px solid #c9dcf2;border-radius:9px;color:#2868ae;background:#fff;font-size:.74rem;font-weight:800;cursor:pointer}.refresh-button:disabled{opacity:.55;cursor:wait}
      .record-actions{display:flex;align-items:flex-end;flex-direction:column;gap:7px}.delete-record{padding:4px 8px;border:0;border-radius:8px;color:#bd4d4d;background:#fdecec;font-size:.72rem;font-weight:850;cursor:pointer}
      .record{display:grid;grid-template-columns:48px minmax(72px,1fr) minmax(58px,1fr) 72px 44px;align-items:center;gap:7px;padding:11px 0;font-size:.74rem}.record-date,.record-topic,.record-others,.record .amount{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.record-date,.record-others{color:var(--muted)}.record-topic{font-weight:750;color:var(--ink)}.record .amount{font-size:.74rem;font-weight:850}.record .delete-record{padding:5px 6px;font-size:.68rem}
      .syncing-record{color:#6c7f96;font-size:.64rem;text-align:right}
      .calculated-total{grid-column:2;margin:-5px 0 1px;color:#2868ae;font-size:.75rem;font-weight:800;text-align:right}
      .amount-control{grid-column:2;display:flex;gap:8px}.amount-control #cost{min-width:0;flex:1}.calculator-open{flex:0 0 auto;border:1px solid #c9dcf2;border-radius:10px;background:#eaf3fd;color:#2868ae;padding:0 12px;font-size:.8rem;font-weight:850;cursor:pointer}
      .calculator-modal{position:fixed;inset:0;z-index:20;display:grid;align-items:end;background:rgba(12,34,61,.38);padding:18px}.calculator-modal[hidden]{display:none}.calculator{width:min(100%,420px);margin:auto;padding:16px;border-radius:22px;background:#fff;box-shadow:0 20px 60px rgba(10,37,69,.3)}.calculator-display{margin-bottom:12px;padding:8px 12px;border-radius:12px;background:#f7faff;text-align:right;min-height:54px}.calculator-expression{display:block;min-height:20px;color:var(--muted);font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.calculator-result{display:block;margin-top:3px;color:var(--ink);font-size:1.4rem;font-weight:850;font-variant-numeric:tabular-nums}.calculator-keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.calculator-key{min-height:54px;border:0;border-radius:13px;background:#edf3fb;color:#153e72;font-size:1.3rem;font-weight:800;cursor:pointer}.calculator-key.operator{background:#dbeafd}.calculator-key.clear{color:#b84c42;background:#fff0ee}.calculator-key.backspace{background:#f0f2f5}.calculator-key.plus{grid-column:4;grid-row:5 / span 2;height:100%}.calculator-key.cancel{grid-column:1;grid-row:6;color:#153e72;background:#ffc4ad;font-size:1rem}.calculator-key.confirm{grid-column:2 / span 2;grid-row:6;color:#fff;background:#123c70;font-size:1.25rem}
      @media(max-width:390px){.record{grid-template-columns:43px minmax(62px,1fr) minmax(48px,1fr) 66px 40px;gap:5px}.record .amount{font-size:.7rem}.record .delete-record{padding:5px 4px;font-size:.64rem}}
    </style>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div><p class="eyebrow">PERSONAL SPENDING</p><h1>个人花费</h1><p class="muted">只记录你自己的日常开销</p></div>
        <div class="top-actions"><div class="view-switch"><button id="recordButton" class="view-button active" type="button">记录花费</button><button id="analysisButton" class="view-button" type="button">当月分析</button><button id="monthlyButton" class="view-button" type="button">每月分析</button></div><button id="refreshButton" class="refresh-button" type="button">↻ 刷新资料</button></div>
      </header>

      <div id="recordView">
      <section class="hero-card">
        <div><span class="label">本月总花费</span><strong id="heroTotal">0.00</strong></div>
        <div class="hero-mark" aria-hidden="true"><img src="./logo.png" alt="" /></div>
      </section>

      <section class="card">
        <div class="section-head"><h2>新增花费</h2><a class="local-badge" href="https://docs.google.com/spreadsheets/d/1Dcog-g4Epq5qprE3iHC7p_QFOYLKdbMC2Lh2fs3IFEo/edit?gid=0#gid=0" target="_blank" rel="noopener">Google Sheet</a></div>
        <form id="expenseForm">
          <div class="field-row"><label for="date">日期</label><div class="date-control"><input id="date" type="text" inputmode="numeric" placeholder="11/08/2026" maxlength="10" required /><button id="calendarButton" class="calendar-button" type="button" aria-label="选择日期">▣</button></div><input id="datePicker" type="date" tabindex="-1" aria-hidden="true" /></div>
          <div class="field-row"><label for="topic">课题</label><select id="topic" required></select></div>
          <div class="field-row"><label for="others">额外</label><input id="others" type="text" placeholder="details" /></div>
          <div class="field-row"><label for="cost">金额</label><div class="amount-control"><input id="cost" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="0.00" required /><button id="calculatorOpen" class="calculator-open" type="button">计算</button></div><span id="calculatedTotal" class="calculated-total">合计 0.00</span></div>
          <button class="primary" type="submit">记录</button>
          <p id="status" class="status" role="status"></p>
        </form>
      </section>

      <section class="card"><div class="section-head"><h2>最近记录</h2><span id="recordCount" class="muted"></span></div><div id="records" class="records"></div></section>
      </div>
      <section id="analysisView" class="card analysis-view" hidden><div class="section-head"><h2>当月分析</h2><input id="analysisMonth" class="analysis-month-picker" type="month" aria-label="选择分析月份" /></div><div id="monthlyChart" class="chart"></div></section>
      <section id="monthlyComparisonView" class="card analysis-view" hidden><div class="section-head"><h2>每月分析</h2><span class="muted">各 Category 对比</span></div><div id="monthlyComparison" class="comparison-scroll"></div></section>
    </main>
    <div id="calculatorModal" class="calculator-modal" hidden>
      <div class="calculator" role="dialog" aria-modal="true" aria-labelledby="calculatorTitle">
        <div id="calculatorTitle" class="calculator-display"><span id="calculatorExpression" class="calculator-expression">0</span><strong id="calculatorResult" class="calculator-result">0.00</strong></div>
        <div id="calculatorKeys" class="calculator-keys">
          <button class="calculator-key" data-key="%" type="button">%</button><button class="calculator-key" data-key="(" type="button">(</button><button class="calculator-key" data-key=")" type="button">)</button><button class="calculator-key backspace" data-action="delete" type="button">⌫</button>
          <button class="calculator-key" data-key="7" type="button">7</button><button class="calculator-key" data-key="8" type="button">8</button><button class="calculator-key" data-key="9" type="button">9</button><button class="calculator-key operator" data-key="*" type="button">×</button>
          <button class="calculator-key" data-key="4" type="button">4</button><button class="calculator-key" data-key="5" type="button">5</button><button class="calculator-key" data-key="6" type="button">6</button><button class="calculator-key operator" data-key="-" type="button">−</button>
          <button class="calculator-key" data-key="1" type="button">1</button><button class="calculator-key" data-key="2" type="button">2</button><button class="calculator-key" data-key="3" type="button">3</button><button class="calculator-key operator" data-key="-" type="button">−</button>
          <button class="calculator-key clear" data-action="clear" type="button">清除</button><button class="calculator-key" data-key="0" type="button">0</button><button class="calculator-key" data-key="." type="button">.</button><button class="calculator-key operator plus" data-key="+" type="button">＋</button>
          <button id="calculatorCancel" class="calculator-key cancel" type="button">取消</button><button id="calculatorEquals" class="calculator-key confirm" type="button">＝</button>
        </div>
      </div>
    </div>
    <script src="./app.js?v=20260820-2"></script>
  </body>
</html>
