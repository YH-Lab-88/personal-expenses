<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#123c70" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <title>个人花费</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./styles.css" />
    <style>
      :root{--ink:#123c70;--muted:#6c7f96;--line:#d9e5f2;--bg:#f3f7fc;--accent:#2d74c8;--soft:#eaf3fd;--shadow:0 14px 35px rgba(18,60,112,.1)}
      .hero-card{background:linear-gradient(135deg,#123c70,#2d74c8)}
      .month-chip{border-color:#c9dcf2;background:#f8fbff}
      .local-badge{color:#2868ae}
      input,select{background:#fbfdff}
      input[type=date]{height:50px;min-height:50px;padding:0 13px;appearance:none;-webkit-appearance:none;color:#234d7e;font-weight:700;color-scheme:light}
      #date{height:50px;text-align:left;font-weight:700;letter-spacing:.02em;flex:1}
      .field-row{display:grid;grid-template-columns:42px 1fr;align-items:center;gap:10px;position:relative}.field-row>label{display:block;color:var(--muted);font-size:.8rem;font-weight:750}.field-row>input,.field-row>select{grid-column:2}.field-row>#datePicker{position:absolute;right:0;width:42px;height:42px;opacity:0;z-index:2;cursor:pointer}
      .date-control{grid-column:2;display:flex;align-items:center;gap:8px}.date-control #date{grid-column:auto}.calendar-button{display:grid;place-items:center;width:42px;height:42px;flex:0 0 42px;border:1px solid #c9dcf2;border-radius:10px;color:#2868ae;background:#eaf3fd;font-size:1.15rem;cursor:pointer}
      input[type=number]{text-align:right;font-variant-numeric:tabular-nums lining-nums}
      #cost{text-align:left}
      .month-chip strong,.hero-card strong,.bar-value,.record .amount,.month-analysis-head span{font-variant-numeric:tabular-nums lining-nums}
      .bar-value,.record .amount,.month-analysis-head span{white-space:nowrap;text-align:right}
      input[type=number]{text-align:right;font-variant-numeric:tabular-nums}
      .month-chip strong,.hero-card strong,.amount,.bar-value,.month-analysis-head span{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
      .amount,.bar-value,.month-analysis-head span{min-width:82px;text-align:right;white-space:nowrap}
      input:focus,select:focus{outline-color:rgba(45,116,200,.2)}
      .bar-track{background:#e9f0f8}
      .top-actions{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
      .view-switch{display:flex;gap:5px;padding:4px;border-radius:12px;background:#eaf3fd}.view-button{padding:7px 9px;border:0;border-radius:8px;color:#2868ae;background:transparent;font-size:.74rem;font-weight:800;cursor:pointer}.view-button.active{color:#fff;background:#2d74c8}.analysis-view{min-height:220px}
      .month-analysis{padding:14px 0;border-bottom:1px solid var(--line)}.month-analysis:last-child{border-bottom:0}.month-analysis-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;color:var(--ink)}
      .refresh-button{padding:7px 10px;border:1px solid #c9dcf2;border-radius:9px;color:#2868ae;background:#fff;font-size:.74rem;font-weight:800;cursor:pointer}.refresh-button:disabled{opacity:.55;cursor:wait}
      .record-actions{display:flex;align-items:flex-end;flex-direction:column;gap:7px}.delete-record{padding:4px 8px;border:0;border-radius:8px;color:#bd4d4d;background:#fdecec;font-size:.72rem;font-weight:850;cursor:pointer}
      .lucky-cat{display:grid;place-items:center;width:72px;height:72px}.lucky-cat svg{width:72px;height:72px;overflow:visible}.cat-paw{transform-origin:355px 145px;animation:cat-wave 1.2s ease-in-out infinite alternate}@keyframes cat-wave{from{transform:rotate(-12deg)}to{transform:rotate(16deg)}}
      .record{display:grid;grid-template-columns:48px minmax(72px,1fr) minmax(58px,1fr) 72px 44px;align-items:center;gap:7px;padding:11px 0;font-size:.74rem}.record-date,.record-topic,.record-others,.record .amount{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.record-date,.record-others{color:var(--muted)}.record-topic{font-weight:750;color:var(--ink)}.record .amount{font-size:.74rem;font-weight:850}.record .delete-record{padding:5px 6px;font-size:.68rem}
      @media(max-width:390px){.record{grid-template-columns:43px minmax(62px,1fr) minmax(48px,1fr) 66px 40px;gap:5px}.record .amount{font-size:.7rem}.record .delete-record{padding:5px 4px;font-size:.64rem}}
    </style>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div><p class="eyebrow">PERSONAL SPENDING</p><h1>个人花费</h1><p class="muted">只记录你自己的日常开销</p></div>
        <div class="top-actions"><div class="view-switch"><button id="recordButton" class="view-button active" type="button">记录花费</button><button id="analysisButton" class="view-button" type="button">每月分析</button></div><button id="refreshButton" class="refresh-button" type="button">↻ 刷新资料</button></div>
      </header>

      <div id="recordView">
      <section class="hero-card">
        <div><span class="label">本月总花费</span><strong id="heroTotal">RM 0.00</strong></div>
        <div class="lucky-cat" aria-label="动态招财猫"><svg viewBox="0 0 420 420" role="img" aria-hidden="true"><circle cx="210" cy="210" r="128" fill="#bfe3ff" opacity=".2"/><path d="M112 160 116 75l64 46c19-8 41-12 62-12s43 4 62 12l64-46-4 85c18 26 27 57 27 91 0 83-67 140-149 140S93 334 93 251c0-34 7-65 19-91Z" fill="#ffd766" stroke="#fff" stroke-width="8"/><path d="M115 78 178 121 120 143Z" fill="#ffb84d"/><path d="m305 78-63 43 58 22Z" fill="#ffb84d"/><circle cx="165" cy="219" r="10" fill="#123c70"/><circle cx="255" cy="219" r="10" fill="#123c70"/><path d="M190 270q20 18 40 0" fill="none" stroke="#123c70" stroke-width="8" stroke-linecap="round"/><path d="M154 286q56 46 112 0" fill="#e94d64" stroke="#fff" stroke-width="7"/><g class="cat-paw"><path d="M333 178q48-18 50 29t-34 64q-27 8-39-13t23-80Z" fill="#ffd766" stroke="#fff" stroke-width="8"/><path d="M357 190v49" stroke="#123c70" stroke-width="7" stroke-linecap="round"/></g><path d="M88 286q-43 10-57 48" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round"/></svg></div>
      </section>

      <section class="card">
        <div class="section-head"><h2>新增花费</h2><span class="local-badge">Google Sheet</span></div>
        <form id="expenseForm">
          <div class="field-row"><label for="date">日期</label><div class="date-control"><input id="date" type="text" inputmode="numeric" placeholder="11/08/2026" maxlength="10" required /><button id="calendarButton" class="calendar-button" type="button" aria-label="选择日期">▣</button></div><input id="datePicker" type="date" tabindex="-1" aria-hidden="true" /></div>
          <div class="field-row"><label for="topic">课题</label><select id="topic" required></select></div>
          <div class="field-row"><label for="others">额外</label><input id="others" type="text" placeholder="details" /></div>
          <div class="field-row"><label for="cost">金额</label><input id="cost" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="0.00" required /></div>
          <button class="primary" type="submit">记录</button>
          <p id="status" class="status" role="status"></p>
        </form>
      </section>

      <section class="card"><div class="section-head"><h2>最近记录</h2><span id="recordCount" class="muted"></span></div><div id="records" class="records"></div></section>
      </div>
      <section id="analysisView" class="card analysis-view" hidden><div class="section-head"><h2>每月分析</h2><span class="muted">按 Topic 分类</span></div><div id="monthlyChart" class="chart"></div></section>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
